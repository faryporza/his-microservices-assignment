name: CI

on:
  push:
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: postgres
      PGPASSWORD: postgres
      OPD_DATABASE: opd_db
      EMR_DATABASE: emr_db
      FINANCE_DATABASE: finance_db
      OPD_PORT: 3000
      EMR_PORT: 3001
      FINANCE_PORT: 3002
      OPD_RABBITMQ_QUEUE: opd.events
      EMR_RABBITMQ_QUEUE: emr.events
      FINANCE_RABBITMQ_QUEUE: finance.events
      RABBITMQ_URL: amqp://guest:guest@localhost:5672
      RABBITMQ_EXCHANGE: his.events
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      rabbitmq:
        image: rabbitmq:3-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: his-project/package-lock.json

      - name: Install dependencies
        working-directory: his-project
        run: npm ci

      - name: Create HIS databases
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -c 'CREATE DATABASE opd_db;'
          psql -h 127.0.0.1 -U postgres -d postgres -c 'CREATE DATABASE emr_db;'
          psql -h 127.0.0.1 -U postgres -d postgres -c 'CREATE DATABASE finance_db;'

      - name: Run ESLint
        working-directory: his-project
        run: npm run lint:check

      - name: Run unit and integration tests with coverage
        working-directory: his-project
        run: npm run test:cov

      - name: Build all services
        working-directory: his-project
        run: npm run build

      - name: Run end-to-end tests
        working-directory: his-project
        run: npm run test:e2e

      - name: Run live event flow with deferred consumers
        working-directory: his-project
        env:
          FLOW_STATE_FILE: /tmp/his-flow-state.json
        run: |
          set -euo pipefail
          npm run start:prod:opd > /tmp/opd-bc.log 2>&1 &
          opd_pid=$!
          npm run start:prod:emr > /tmp/emr-bc.log 2>&1 &
          emr_pid=$!
          npm run start:prod:finance > /tmp/finance-bc.log 2>&1 &
          finance_pid=$!
          cleanup() {
            kill "$opd_pid" "$emr_pid" "$finance_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          for port in 3000 3001 3002; do
            curl --fail --retry 20 --retry-delay 1 --retry-connrefused "http://127.0.0.1:${port}/"
          done
          kill "$emr_pid" "$finance_pid"
          sleep 1
          npm run test:flow -- create
          npm run start:prod:emr > /tmp/emr-bc.log 2>&1 &
          emr_pid=$!
          npm run start:prod:finance > /tmp/finance-bc.log 2>&1 &
          finance_pid=$!
          npm run test:flow -- complete
